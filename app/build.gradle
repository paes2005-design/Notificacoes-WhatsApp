plugins {
    id 'com.android.application'
}

def uploadKeystorePath = System.getenv('PLAY_UPLOAD_KEYSTORE_PATH')
def uploadStorePassword = System.getenv('PLAY_UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = System.getenv('PLAY_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = System.getenv('PLAY_UPLOAD_KEY_PASSWORD')

android {
    namespace 'com.monitorwhatsapp.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.monitorwhatsapp.client'
        minSdk 26
        targetSdk 36
        versionCode 102
        versionName '1.0.2-client'
    }

    signingConfigs {
        release {
            if (uploadKeystorePath) {
                storeFile file(uploadKeystorePath)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        debug {
        }
        release {
            if (uploadKeystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    testImplementation 'junit:junit:4.13.2'
}
