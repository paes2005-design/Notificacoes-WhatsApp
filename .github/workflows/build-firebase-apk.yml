name: Build Firebase APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/test-signing.jks.b64'
      - '.github/workflows/build-firebase-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore fixed Firebase test key
        run: |
          base64 --decode .github/test-signing.jks.b64 > app/test-signing.jks
          test -s app/test-signing.jks

      - name: Build signed release APK for Firebase testing
        env:
          PLAY_UPLOAD_KEYSTORE_PATH: test-signing.jks
          PLAY_UPLOAD_STORE_PASSWORD: alerta-test-2026
          PLAY_UPLOAD_KEY_ALIAS: alerta-test
          PLAY_UPLOAD_KEY_PASSWORD: alerta-test-2026
        run: gradle assembleRelease --stacktrace

      - name: Validate signed APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" Notificacoes-WhatsApp-Cliente-v1.0.1-firebase.apk
          unzip -t Notificacoes-WhatsApp-Cliente-v1.0.1-firebase.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs Notificacoes-WhatsApp-Cliente-v1.0.1-firebase.apk
          sha256sum Notificacoes-WhatsApp-Cliente-v1.0.1-firebase.apk

      - name: Remove signing material
        if: always()
        run: rm -f app/test-signing.jks

      - name: Upload Firebase APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notificacoes-WhatsApp-Cliente-v1.0.1-firebase
          path: Notificacoes-WhatsApp-Cliente-v1.0.1-firebase.apk
          if-no-files-found: error
