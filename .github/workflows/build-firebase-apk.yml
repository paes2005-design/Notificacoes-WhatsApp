name: Build Firebase APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-firebase-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build unsigned release APK
        run: gradle assembleRelease --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -1)
          test -n "$APK"
          test -s "$APK"
          cp "$APK" Notificacoes-WhatsApp-Cliente-v1.0-release-unsigned.apk
          sha256sum Notificacoes-WhatsApp-Cliente-v1.0-release-unsigned.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Notificacoes-WhatsApp-Cliente-v1.0-release-unsigned
          path: Notificacoes-WhatsApp-Cliente-v1.0-release-unsigned.apk
          if-no-files-found: error
