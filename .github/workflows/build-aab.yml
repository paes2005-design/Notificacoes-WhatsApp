name: Build AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-aab.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release AAB
        run: gradle bundleRelease --stacktrace

      - name: Validate and rename AAB
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          cp "$AAB" Notificacoes-WhatsApp-Cliente-v1.0-unsigned.aab
          sha256sum Notificacoes-WhatsApp-Cliente-v1.0-unsigned.aab

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: Notificacoes-WhatsApp-Cliente-v1.0-unsigned-aab
          path: Notificacoes-WhatsApp-Cliente-v1.0-unsigned.aab
          if-no-files-found: error
