name: Build Play AAB

on:
  workflow_dispatch:

jobs:
  build-play-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/play-upload.jks"
          test -s "$RUNNER_TEMP/play-upload.jks"

      - name: Build signed release AAB
        env:
          PLAY_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/play-upload.jks
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Validate and rename AAB
        env:
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cp app/build/outputs/bundle/release/app-release.aab Notificacoes-WhatsApp-Cliente-v1.0-play.aab
          unzip -t Notificacoes-WhatsApp-Cliente-v1.0-play.aab
          jarsigner -verify -certs Notificacoes-WhatsApp-Cliente-v1.0-play.aab
          sha256sum Notificacoes-WhatsApp-Cliente-v1.0-play.aab

      - name: Upload Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Notificacoes-WhatsApp-Cliente-v1.0-play-aab
          path: Notificacoes-WhatsApp-Cliente-v1.0-play.aab
          if-no-files-found: error
