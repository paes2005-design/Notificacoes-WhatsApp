name: Migrate Cliente Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and sanitize client source
        run: |
          set -euo pipefail
          LEGACY_COMMIT="826072e98d10048c86a3313e47ea4b0aeca06a89"
          curl -L --fail "https://github.com/paes2005-design/Rotinas_Family/archive/${LEGACY_COMMIT}.zip" -o legacy.zip
          unzip -q legacy.zip -d legacy
          LEGACY="legacy/Rotinas_Family-${LEGACY_COMMIT}"

          cat "$LEGACY"/build-v03-parts/project.b64.* | base64 --decode > monitor-v03.zip
          unzip -q monitor-v03.zip -d buildsrc

          mv buildsrc/Monitor_WhatsApp_v0.3 buildsrc/Monitor_WhatsApp_v0.4
          cat "$LEGACY"/build-v04-delta/v04.patch.gz.b64.part.* > v04.patch.gz.b64
          base64 --decode v04.patch.gz.b64 | gzip -d > v04.patch
          (cd buildsrc && patch -p1 < ../v04.patch)

          mv buildsrc/Monitor_WhatsApp_v0.4 buildsrc/Monitor_WhatsApp_v0.5
          cat "$LEGACY"/build-v05-delta/v05.patch.gz.b64.part.* > v05.patch.gz.b64
          base64 --decode v05.patch.gz.b64 | gzip -d > v05.patch
          (cd buildsrc/Monitor_WhatsApp_v0.5 && patch -p1 < ../../v05.patch)

          mv buildsrc/Monitor_WhatsApp_v0.5 buildsrc/Monitor_WhatsApp_v0.7
          base64 --decode "$LEGACY"/build-v07-delta/v07.patch.gz.b64 | gzip -d > v07.patch
          (cd buildsrc/Monitor_WhatsApp_v0.7 && patch -p2 < ../../v07.patch)

          cat "$LEGACY"/build-client-v1/client-v1.patch.gz.b64.part.* > client-v1.patch.gz.b64
          base64 --decode client-v1.patch.gz.b64 | gzip -d > client-v1.patch
          (cd buildsrc/Monitor_WhatsApp_v0.7 && patch -p1 < ../../client-v1.patch)
          mv buildsrc/Monitor_WhatsApp_v0.7 buildsrc/Notificacoes-WhatsApp

          SRC="buildsrc/Notificacoes-WhatsApp"
          rm -f "$SRC/app/test-signing.jks" "$SRC/TESTE_V0.1.md" "$SRC/TESTE_V0.4.md"

          cat > "$SRC/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.monitorwhatsapp.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.monitorwhatsapp.client'
                  minSdk 26
                  targetSdk 35
                  versionCode 100
                  versionName '1.0.0-client'
              }

              buildTypes {
                  debug {
                  }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.15.0'
          }
          EOF

          sed -i "s/rootProject.name = 'MonitorWhatsApp'/rootProject.name = 'NotificacoesWhatsApp'/" "$SRC/settings.gradle"

          cat > "$SRC/.gitignore" <<'EOF'
          .gradle/
          **/build/
          local.properties
          *.iml
          .idea/
          *.jks
          *.keystore
          EOF

          cat > "$SRC/README.md" <<'EOF'
          # Notificações WhatsApp

          Aplicativo Android para monitorar notificações do WhatsApp e destacar assuntos importantes após autorização explícita do usuário ao acesso de notificações.

          ## Versão Cliente 1.0

          - conversa/grupo opcional;
          - pessoa/remetente opcional;
          - palavras importantes opcionais;
          - histórico de alertas;
          - abertura da conversa pelo PendingIntent fornecido pelo WhatsApp;
          - NotificationListenerService com recuperação em segundo plano;
          - sem login ou QR Code do WhatsApp;
          - sem leitura do banco privado do WhatsApp;
          - sem AccessibilityService;
          - sem permissão INTERNET.

          A assinatura de produção não é armazenada no repositório. Antes da publicação, uma chave privada de release deverá ser configurada com segurança.
          EOF

          grep -Fq "applicationId 'com.monitorwhatsapp.client'" "$SRC/app/build.gradle"
          grep -Fq "versionName '1.0.0-client'" "$SRC/app/build.gradle"
          grep -Fq "class ClientMainActivity" "$SRC/app/src/main/java/com/monitorwhatsapp/app/ClientMainActivity.java"

      - name: Validate sanitized client source
        working-directory: buildsrc/Notificacoes-WhatsApp
        run: gradle assembleDebug --stacktrace

      - name: Copy source to repository root
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='.github/' \
            --exclude='.gradle/' \
            --exclude='build/' \
            --exclude='app/build/' \
            buildsrc/Notificacoes-WhatsApp/ ./
          rm -rf legacy legacy.zip monitor-v03.zip buildsrc v04.patch* v05.patch* v07.patch* client-v1.patch*

      - name: Commit source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/bootstrap-source.yml'
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "feat: migrate client v1.0 source [source-migrated]"
            git push origin main
          fi
